[workspace]
resolver = "3"
members = ["crates/ui-kit", "crates/proto", "crates/core", "apps/elo", "apps/elo-server"]
default-members = ["apps/elo"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.98"

[workspace.dependencies]
stringari-ui = { path = "crates/ui-kit" }
elo-proto = { path = "crates/proto" }
elo-core = { path = "crates/core" }
elo-server = { path = "apps/elo-server" }
eframe = { version = "0.37", default-features = false }
egui = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
postcard = { version = "1", features = ["use-std"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
spake2 = "0.4"
chacha20poly1305 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-encoder = "0.7"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
