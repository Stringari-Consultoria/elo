# Avisa por pull request quando uma dependência ou ação tem versão nova
# (inclusive correções de segurança). Tudo junto num pedido por semana para
# cada tipo: um pedido por pacote enchia a fila do CI e atrasava as versões.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      acoes:
        patterns: ["*"]
