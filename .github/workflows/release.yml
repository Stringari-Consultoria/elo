name: Release
# Gera os instaladores. Numa tag v*, publica uma release com eles; manualmente
# (Actions → Release → Run workflow), deixa os arquivos como artefatos.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # A versão mais antiga suportada: o .deb pede a glibc daqui (2.35) ou mais nova.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxdo-dev fakeroot
      - run: scripts/pacote-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: elo-linux
          path: dist/*

  macos:
    runs-on: macos-latest
    # Assinatura e notarização da Apple: só acontecem com estes secrets
    # configurados no repositório (veja o README). Sem eles, assinatura ad hoc.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Certificado Developer ID (se configurado)
        if: env.APPLE_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/elo.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "ASSINATURA=$APPLE_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials elo --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KC"
            echo "NOTARIZAR=elo" >> "$GITHUB_ENV"
            echo "NOTARIZAR_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          fi
      - run: scripts/pacote-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: elo-macos
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install innosetup -y --no-progress
      - run: scripts/pacote-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: elo-windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Manifesto da atualização automática, assinado (Ed25519). A tag tem de
      # bater com a versão do Cargo.toml: senão o app atualizaria em loop.
      - name: Manifesto assinado das atualizações
        env:
          ELO_UPDATE_KEY: ${{ secrets.ELO_UPDATE_KEY }}
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          CARGO="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$VERSAO" = "$CARGO" ] || { echo "tag v$VERSAO diferente do Cargo.toml ($CARGO)"; exit 1; }
          [ -n "$ELO_UPDATE_KEY" ] || { echo "secret ELO_UPDATE_KEY ausente"; exit 1; }
          python3 scripts/manifesto.py "$VERSAO" dist > dist/latest.json
          printf '%s\n' "$ELO_UPDATE_KEY" > "$RUNNER_TEMP/chave.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/chave.pem" -in dist/latest.json -out dist/latest.json.sig
          rm -f "$RUNNER_TEMP/chave.pem"
          cat dist/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
