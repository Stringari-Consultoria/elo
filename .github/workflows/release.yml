name: Release
# Gera os instaladores. Numa tag v*, publica uma release com eles; manualmente
# (Actions → Release → Run workflow), deixa os arquivos como artefatos.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # A versão mais antiga suportada: o .deb pede a glibc daqui (2.35) ou mais nova.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxdo-dev fakeroot
      - run: scripts/pacote-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: elo-linux
          path: dist/*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/pacote-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: elo-macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
