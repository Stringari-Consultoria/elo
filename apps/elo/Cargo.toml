[package]
name = "elo"
description = "Elo by Stringari — acesso remoto"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Idioma do sistema (português ou inglês na interface).
sys-locale = "0.3"
elo-core = { workspace = true }
elo-proto = { workspace = true }
elo-server = { workspace = true }
stringari-ui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "accesskit", "clipboard", "default_fonts", "wayland", "x11"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
directories = "6"
rfd = "0.17"
arboard = { version = "3", default-features = false }
sha2 = { workspace = true }
image = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls"] }
ed25519-dalek = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# Bandeja via StatusNotifierItem (D-Bus, sem GTK).
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

[build-dependencies]
winresource = { version = "0.1", default-features = false }
