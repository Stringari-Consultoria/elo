[package]
name = "elo"
description = "Elo by Stringari — acesso remoto"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
elo-core = { workspace = true }
elo-proto = { workspace = true }
elo-server = { workspace = true }
stringari-ui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "accesskit", "clipboard", "default_fonts", "wayland", "x11"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
directories = "6"
rfd = "0.17"
arboard = { version = "3", default-features = false }
sha2 = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls"] }
ed25519-dalek = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

[build-dependencies]
winresource = { version = "0.1", default-features = false }
