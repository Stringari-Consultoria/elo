[package]
name = "elo-core"
description = "Núcleo do Elo: conexão com o servidor, sessões de anfitrião e visualizador, captura e controle"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
elo-proto = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
rustls = { workspace = true }
webpki-roots = "1"
mac_address = "1"
tungstenite = { workspace = true }
arboard = { version = "3", default-features = false }
image = { workspace = true }
# Som: Opus em Rust puro (sem C) e saída/captura de som nos três sistemas.
opus1 = "0.3"
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xtest", "randr"] }
# Rolagem suave (mouse virtual pelo uinput).
evdev = "0.13"
# Wayland: portal (RemoteDesktop + ScreenCast) e quadros pelo PipeWire.
ashpd = { version = "0.14", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
# A mesma versão do xcap (só pode haver uma cópia da biblioteca nativa).
pipewire = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = "0.9"
enigo = "0.6"

[dev-dependencies]
