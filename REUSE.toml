# Licença e autoria dos arquivos que não têm onde levar um cabeçalho SPDX
# (imagens, documentos, dados). Os de código levam o cabeçalho no próprio
# arquivo. Padrão REUSE: https://reuse.software (confira com `reuse lint`).
version = 1

[[annotations]]
path = [
    "**/*.md", "LICENSE", "NOTICE", "Cargo.lock",
    "docs/**", "packaging/**/*.png", "packaging/**/*.ico", "packaging/**/*.svg",
    "packaging/**/*.xml", "packaging/**/*.plist", "packaging/**/*.policy",
    "apps/elo/src/testdata/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gabriel Stringari"
SPDX-License-Identifier = "AGPL-3.0-only"

# Símbolo da Stringari: o arquivo segue a AGPL, mas a marca não (NOTICE, item c).
[[annotations]]
path = "assets/marca/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stringari Consultoria & Tech"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["assets/fonts/Geist-*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 Vercel, in collaboration with basement.studio"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/JetBrainsMono-*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"
